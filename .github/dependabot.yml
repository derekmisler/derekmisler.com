version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    # Delay adopting new releases to let the community surface issues.
    # Does NOT apply to security updates, those are always immediate.
    cooldown:
      default-days: 3
      semver-patch-days: 3 # Most malicious packages are caught within 72 h
      semver-minor-days: 7
      semver-major-days: 30
    ignore:
      # astro check rejects TypeScript 7, drop this once the project moves to @astrojs/ts-content-mapper (needs TS 7.1+).
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      # These packages must stay on matching versions, majors included.
      storybook:
        patterns:
          - 'storybook'
          - '@storybook/*'
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
