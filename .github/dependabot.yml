version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    # Delay adopting new releases to let the community surface issues.
    # Does NOT apply to security updates — those are always immediate.
    cooldown:
      default-days: 3
      semver-patch-days: 3 # Most malicious packages are caught within 72 h
      semver-minor-days: 7
      semver-major-days: 30
    ignore:
      # @types/node tracks the Node major in .nvmrc; bump it with Node, by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 3
    # Disable automatic version updates, just get security updates
    # https://docs.github.com/en/code-security/dependabot/dependabot-security-updates/configuring-dependabot-security-updates#overriding-the-default-behavior-with-a-configuration-file
    open-pull-requests-limit: 0
